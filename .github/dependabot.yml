version: 2

updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    # Compose / AGP / Kotlin 三者版本强耦合，一起手动升，避免自动 PR 打散
    ignore:
      - dependency-name: "androidx.compose*"
      - dependency-name: "com.android.tools.build:gradle"
      - dependency-name: "com.android.application"
      - dependency-name: "org.jetbrains.kotlin*"
      # core-ktx 1.16+ 与 navigation 2.9+ 都是用 Kotlin 2.x 编译的，
      # 在 Kotlin 1.9 上会直接报「metadata version 2.1.0，期望 1.9.0」。
      # 这类 PR 不是升级，是构建链迁移的一部分，见 issue #30。
      - dependency-name: "androidx.core*"
      - dependency-name: "androidx.navigation*"
      # Gradle 9 要求 AGP 8.9+ 与 Kotlin 2.x，是一次构建链迁移，不是改一行
      # 版本号能做完的。这类 PR 每周冒出来一次只会变成噪音，需要时单独开 issue。
      - dependency-name: "gradle"
        update-types: ["version-update:semver-major"]
    # 小版本和补丁合成一个 PR。分开提的结果是四个 PR 同时挂在列表里，
    # 每个都要单独跑一遍 CI、单独判一次兼容性。
    groups:
      gradle-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    # 这几个 action 基本同源、同运行时，合起来升一次就够
    groups:
      github-actions:
        patterns: ["*"]
