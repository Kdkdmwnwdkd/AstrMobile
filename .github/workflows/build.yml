name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure preinstalled Android SDK
        run: |
          set -euo pipefail
          # ubuntu-latest 已预装 Android SDK，直接复用，避免 setup-android 的许可交互失败
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER=""
          for candidate in "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
                           "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
          done
          if [ -z "$SDKMANAGER" ]; then
            echo "未找到 sdkmanager，列出 SDK 目录："
            ls -la "$SDK_ROOT" || true
            exit 1
          fi
          echo "使用 sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

          echo "--- 已安装组件 ---"
          ls "$SDK_ROOT/platforms" || true
          ls "$SDK_ROOT/build-tools" || true
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Fetch bundled Ubuntu rootfs
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/rootfs
          URL="https://raw.githubusercontent.com/undertaker33/ElymBot/main/app/src/main/assets/runtime/assets/ubuntu-rootfs.tar.xz"
          curl -fL --retry 3 --retry-delay 3 --connect-timeout 20 --max-time 600 \
            -o app/src/main/assets/rootfs/ubuntu-rootfs.tar.xz "$URL"
          echo "91acaa786b8e2fbba56a9fd0f8a1188cee482b5c7baeed707b29ddaa9a294daa  app/src/main/assets/rootfs/ubuntu-rootfs.tar.xz" | sha256sum -c -
          ls -lh app/src/main/assets/rootfs/

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -lh "$APK"
          "$ANDROID_HOME"/build-tools/34.0.0/apksigner verify --print-certs "$APK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AstrMobile-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AstrMobile latest
          body: |
            自动构建的 debug 包。

            - 架构：arm64-v8a
            - 最低系统：Android 8.0 (API 26)
            - 每次推送到 main 自动更新

            首次安装需联网 10–40 分钟，详见仓库 README。
          files: app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
          make_latest: true
