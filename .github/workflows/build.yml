name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档/协作配置的提交不重新打包，避免同一版本号被反复覆盖发布
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.editorconfig'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/dependabot.yml'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 容器脚本跑在手机里，语法错误的表现是「装到一半失败 / 起不来」，
      # 真机上极难定位。这一步不依赖 Android SDK，几十毫秒就能跑完，放在最前面。
      - name: Check container scripts
        run: python3 tools/check_scripts.py

      # 版本号和更新日志对不上不会让构建失败，但会让人看发布页时迷惑
      - name: Check release metadata
        run: python3 tools/check_version.py

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure preinstalled Android SDK
        run: |
          set -euo pipefail
          # ubuntu-latest 已预装 Android SDK，直接复用，避免 setup-android 的许可交互失败
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER=""
          for candidate in "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
                           "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
          done
          if [ -z "$SDKMANAGER" ]; then
            echo "未找到 sdkmanager，列出 SDK 目录："
            ls -la "$SDK_ROOT" || true
            exit 1
          fi
          echo "使用 sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

          echo "--- 已安装组件 ---"
          ls "$SDK_ROOT/platforms" || true
          ls "$SDK_ROOT/build-tools" || true
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Unit tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Fetch bundled Ubuntu rootfs
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/rootfs
          URL="https://raw.githubusercontent.com/undertaker33/ElymBot/main/app/src/main/assets/runtime/assets/ubuntu-rootfs.tar.xz"
          curl -fL --retry 3 --retry-delay 3 --connect-timeout 20 --max-time 600 \
            -o app/src/main/assets/rootfs/ubuntu-rootfs.tar.xz "$URL"
          echo "91acaa786b8e2fbba56a9fd0f8a1188cee482b5c7baeed707b29ddaa9a294daa  app/src/main/assets/rootfs/ubuntu-rootfs.tar.xz" | sha256sum -c -
          ls -lh app/src/main/assets/rootfs/

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Read version
        id: ver
        run: |
          set -euo pipefail
          NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "构建版本：$NAME ($CODE)"

      - name: Verify APK
        id: apk
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -lh "$APK"
          "$ANDROID_HOME"/build-tools/34.0.0/apksigner verify --print-certs "$APK"
          echo "sha=$(sha256sum "$APK" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "$APK")" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: AstrMobile-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: AstrMobile latest
          body: |
            ## 版本 ${{ steps.ver.outputs.name }}（versionCode ${{ steps.ver.outputs.code }}）

            自动构建的 debug 包，构建于 ${{ github.event.head_commit.timestamp || github.run_started_at }}。

            ### 安装

            - 架构：`arm64-v8a`，最低 Android 8.0（API 26）
            - 覆盖安装不会丢数据（仓库内固定 debug keystore）
            - 首次安装需联网 10–40 分钟

            ### 校验

            ```
            SHA-256: ${{ steps.apk.outputs.sha }}
            大小:    ${{ steps.apk.outputs.size }} 字节
            ```

            ### 说明

            - AstrBot 后台（6185）与 NapCat WebUI（6099）仅监听 `127.0.0.1`；需从电脑访问时用 `adb forward tcp:6185 tcp:6185`
            - 完整说明、已知限制与常见问题见 [README](https://github.com/Kdkdmwnwdkd/AstrMobile#readme)
            - 变更记录见 [CHANGELOG](https://github.com/Kdkdmwnwdkd/AstrMobile/blob/main/CHANGELOG.md)
          files: app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
          make_latest: true
