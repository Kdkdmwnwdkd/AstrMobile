# 纯 CPU 跑本地模型。没显卡就别指望 7B，3B 是上限。
#
#   cp .env.example .env
#   docker compose up -d
#   ./pull-model.sh                 # 默认拉 3B
#   ./pull-model.sh qwen2.5:1.5b-instruct-q4_K_M

name: local-llm

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    environment:
      # 一次只跑一个模型、一次只服务一个并发：4 核经不起并行，会互相拖死
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      # 半小时没人用就卸载模型，把内存还给系统
      OLLAMA_KEEP_ALIVE: "30m"
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./ollama:/root/.ollama
    ports:
      - "${BIND_ADDR:-127.0.0.1}:11434:11434"
    # 留 1 核给系统，不然 SSH 都卡
    cpus: "3.5"
    mem_limit: 6g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
